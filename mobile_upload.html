<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رفع ملف لجلسة الكشك</title>
    <!-- إضافة مكتبة Uploadcare -->
    <script src="https://ucarecdn.com/libs/widget/3.x/uploadcare.full.min.js"></script>
    
    <!-- **الإعدادات: المفتاح العام لـ Uploadcare** -->
    <script>
        UPLOADCARE_PUBLIC_KEY = '8a35eb8e7ba4b585ffa6';
        UPLOADCARE_LOCALE = 'ar'; // لتعريب واجهة المستخدم
        UPLOADCARE_TABS = 'file url'; // لتقييد خيارات التحميل
        UPLOADCARE_PREVIEW_STEP = true; // لعرض خطوة المعاينة
        UPLOADCARE_MAX_FILE_SIZE = 20 * 1024 * 1024; // 20MB
        UPLOADCARE_FILE_TYPES = 'pdf, jpeg, jpg, png, docx'; // أنواع الملفات المسموح بها
    </script>

    <style>
        body {
            font-family: 'Arial', sans-serif;
            text-align: center;
            padding-top: 50px;
            background-color: #f4f4f9;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1 );
            max-width: 400px;
            margin: auto;
        }
        h1 {
            color: #333;
        }
        .session-info {
            margin-top: 20px;
            padding: 10px;
            background-color: #e9ecef;
            border-radius: 5px;
            font-size: 0.9em;
        }
        .error-message {
            color: red;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>رفع ملف لجلسة الكشك</h1>
        
        <div id="error-display" class="error-message" style="display:none;"></div>

        <div id="main-content">
            <div class="session-info">
                <p>معرف الجلسة: <span id="session-id-display">...</span></p>
            </div>
            
            <!-- حقل Uploadcare -->
            <input type="hidden" role="uploadcare-uploader" id="file-uploader" />
        </div>
    </div>

    <script>
        // رابط API الخاص بـ Google Apps Script (تم تحديثه)
        const API_URL = 'https://script.google.com/macros/s/AKfycbzYe43-ZczUW0aqhamnZJhhA33R_e6UNJ3NITjYDGR6viDTXA0_N8b2wcUWK5ytx2Zm/exec';

        let sessionId = '';
        let kioskId = '';

        // دالة لقراءة المعرفات من رابط URL
        function getUrlParameter(name ) {
            name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
            const regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
            const results = regex.exec(location.search);
            return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
        }

        function initialize() {
            sessionId = getUrlParameter('session_id');
            kioskId = getUrlParameter('kiosk_id');

            const errorDisplay = document.getElementById('error-display');
            const mainContent = document.getElementById('main-content');

            if (!sessionId || !kioskId) {
                // عرض رسالة الخطأ إذا كانت المعرفات مفقودة
                errorDisplay.textContent = 'خطأ: معرف الجلسة أو الكشك مفقود. يرجى مسح رمز QR مرة أخرى.';
                errorDisplay.style.display = 'block';
                mainContent.style.display = 'none';
                return;
            }

            // عرض معرف الجلسة
            document.getElementById('session-id-display').textContent = sessionId;

            // 2. معالجة حدث اكتمال التحميل
            const uploader = document.getElementById('file-uploader');
            
            uploader.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    // إرسال البيانات إلى Google Apps Script
                    sendDataToApi(file.uuid);
                }
            });
        }

        // 3. إرسال البيانات إلى Google Apps Script باستخدام XMLHttpRequest (لحل مشكلة الاتصال)
        function sendDataToApi(fileUuid) {
            const formData = new FormData();
            formData.append('action', 'upload');
            formData.append('session_id', sessionId);
            formData.append('kiosk_id', kioskId);
            formData.append('file_uuid', fileUuid);

            const xhr = new XMLHttpRequest();
            xhr.open('POST', API_URL);
            
            xhr.onload = function() {
                // نفترض النجاح إذا لم يكن هناك خطأ في الشبكة
                document.getElementById('main-content').innerHTML = `
                    <h2 style="color: green;">تم تحميل الملف بنجاح!</h2>
                    <p>تم إرسال البيانات إلى الكشك. يمكنك الآن العودة إلى الكشك.</p>
                    <div class="session-info">
                        <p>معرف الملف: ${fileUuid}</p>
                    </div>
                `;
            };

            xhr.onerror = function() {
                console.error('Error sending data to API:', xhr.statusText);
                document.getElementById('main-content').innerHTML = `
                    <h2 style="color: red;">حدث خطأ!</h2>
                    <p>لم نتمكن من تسجيل التحميل. يرجى المحاولة مرة أخرى.</p>
                `;
            };

            xhr.send(formData);
        }

        // بدء التهيئة عند تحميل الصفحة
        window.onload = initialize;
    </script>
</body>
</html>
