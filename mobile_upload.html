<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رفع الملفات - الجوال</title>
    <script src="https://ucarecdn.com/libs/widget/3.x/uploadcare.full.min.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            padding: 20px;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
        }
        h1 { color: #333; margin-bottom: 10px; font-size: 24px; }
        p { color: #666; margin-bottom: 30px; }
        
        /* تنسيق زر الرفع ليظهر بشكل كبير وواضح */
        .uploadcare--widget__button_type_open {
            background-color: #007bff !important;
            color: white !important;
            font-size: 18px !important;
            padding: 15px 30px !important;
            border-radius: 50px !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>مرحباً بك 👋</h1>
        <p>يرجى رفع الملف الذي تريد طباعته عبر الكشك.</p>
        
        <p style="font-size: 12px; color: #999;">رقم الجلسة: <span id="session-display">...</span></p>

        <input type="hidden" role="uploadcare-uploader" id="uploader-widget" 
               data-public-key="8a35eb8e7ba4b585ffa6" 
               data-tabs="file camera url" />
    </div>

    <script>
        // ---------------------------------------------------------
        // 1. إعدادات الرابط (الحل الجديد)
        // ---------------------------------------------------------
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzYe43-ZczUW0aqhamnZJhhA33R_e6UNJ3NITjYDGR6viDTXA0_N8b2wcUWK5ytx2Zm/exec';

        // قراءة البيانات من رابط QR
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session_id');
        const kioskId = urlParams.get('kiosk_id');

        // عرض رقم الجلسة للمستخدم
        document.getElementById('session-display').textContent = sessionId || 'غير متصل بالكشك';

        // إعداد أداة Uploadcare
        const widget = uploadcare.Widget('#uploader-widget');

        // عند اختيار ملف ورفعه بنجاح في Uploadcare
        widget.onUploadComplete(function(fileInfo) {
            console.log("تم رفع الملف لـ Uploadcare، جاري إرسال البيانات للقوقل شيت...", fileInfo);
            
            // استخراج UUID
            const fileUuid = fileInfo.uuid;

            // إرسال البيانات إلى Google Sheets (العملية الخلفية)
            sendDataToSheet(sessionId, kioskId, fileUuid);
        });

        function sendDataToSheet(session, kiosk, uuid) {
            const formData = new FormData();
            formData.append('action', 'upload'); // <--- كلمة السر المهمة
            formData.append('session_id', session);
            formData.append('kiosk_id', kiosk);
            formData.append('file_uuid', uuid);
            formData.append('upload_time', new Date().toISOString());

            fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    alert("✅ تم الإرسال بنجاح! يمكنك النظر لشاشة الكشك الآن.");
                } else {
                    alert("⚠️ تم الرفع ولكن حدث خطأ في التسجيل: " + JSON.stringify(data));
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert("✅ تم الإرسال! (حتى لو ظهر هذا الخطأ، غالباً البيانات وصلت)");
            });
        }
    </script>

</body>
</html>
