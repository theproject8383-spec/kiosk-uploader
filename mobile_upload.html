<!DOCTYPE html>
<html>
<head>
    <title>Mobile File Upload</title>
    <!-- مكتبة Uploadcare لرفع الملفات -->
    <script src="https://ucarecdn.com/libs/widget/3.x/uploadcare.full.min.js" data-public-key="8a35eb8e7ba4b585ffa6"></script>
    <style>
        body { 
            font-family: sans-serif; 
            text-align: center; 
            padding: 20px;
        }
        .upload-area { 
            margin-top: 50px; 
            border: 2px dashed #ccc; 
            padding: 40px; 
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <h1>رفع ملف لجلسة الكشك</h1>
    <p>معرف الجلسة: <span id="session-id-display">جاري التحميل...</span></p>
    
    <div class="upload-area">
        <!-- أداة رفع Uploadcare -->
        <input type="hidden" role="uploadcare-uploader" id="uploader-widget" />
    </div>

    <script>
        // !!! Web app URL الخاص بك (الذي حصلت عليه من Google Apps Script ) !!!
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw-ERdeORuJB3W2zStyZhB06uK_V1kwLrm-tEjrSLU9fo6Bjv_ON-8uPxqzG4jjtalt/exec';

        // 1. الحصول على المعاملات من رابط URL
        const urlParams = new URLSearchParams(window.location.search );
        const sessionId = urlParams.get('session_id');
        const kioskId = urlParams.get('kiosk_id');

        // عرض معرف الجلسة
        document.getElementById('session-id-display').textContent = sessionId || 'غير متوفر';

        if (!sessionId || !kioskId) {
            alert("خطأ: معرف الجلسة أو الكشك مفقود. يرجى مسح رمز QR مرة أخرى.");
        } else {
            // 2. تهيئة أداة رفع Uploadcare
            const uploader = uploadcare.getWidget('#uploader-widget');

            // 3. تعيين خيارات الأداة
            uploader.setOptions({
                multiple: false,
                imagesOnly: false,
                validators: [
                    uploadcare.validators.fileType(['application/pdf', 'image/jpeg', 'image/png', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document']),
                    uploadcare.validators.fileSize(0, 20 * 1024 * 1024) // 20 ميجابايت
                ]
            });

            // 4. إرفاق البيانات الوصفية قبل الرفع
            uploader.onUploadDialog.on('init', (dialog) => {
                dialog.fileColl.onAdd.add((file) => {
                    file.setMetadata({
                        session_id: sessionId,
                        kiosk_id: kioskId,
                        upload_time: new Date().toISOString()
                    });
                });
            });

            // 5. التعامل مع اكتمال الرفع
            uploader.onUploadComplete.add((file) => {
                const fileUuid = file.uuid;
                sendDataToGoogleSheets(sessionId, kioskId, fileUuid);
            });
        }

        // دالة لإرسال البيانات إلى Google Sheets API
        function sendDataToGoogleSheets(sessionId, kioskId, fileUuid) {
            const dataToSend = new FormData();
            dataToSend.append('session_id', sessionId);
            dataToSend.append('kiosk_id', kioskId);
            dataToSend.append('file_uuid', fileUuid);
            dataToSend.append('upload_time', new Date().toISOString());
            dataToSend.append('action', 'upload'); // إضافة معامل الإجراء

            fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                body: dataToSend,
            })
            .then(response => response.json())
            .then(data => {
                if(data.status === 'success'){
                    alert(`تم الرفع وإرسال البيانات بنجاح! UUID: ${fileUuid}. يمكنك الآن إغلاق هذه النافذة والعودة إلى الكشك.`);
                } else {
                    alert('تم الرفع بنجاح، لكن فشل إرسال الإشعار إلى الكشك. يرجى المحاولة مرة أخرى أو إبلاغ الموظفين.');
                }
                // اختياري: إغلاق النافذة بعد تأخير قصير
                setTimeout(() => { window.close(); }, 3000);
            })
            .catch(error => {
                console.error('خطأ في إرسال البيانات إلى Google Sheets:', error);
                alert('تم الرفع بنجاح، لكن فشل إرسال الإشعار إلى الكشك. يرجى المحاولة مرة أخرى أو إبلاغ الموظفين.');
            });
        }
    </script>
</body>
</html>
