<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الدفع والطباعة</title>
    
    <script>
        UPLOADCARE_PUBLIC_KEY = "demopublickey"; 
        UPLOADCARE_LOCALE = "ar"; 
        UPLOADCARE_TABS = "file"; 
    </script>
    <script src="https://ucarecdn.com/libs/widget/3.x/uploadcare.full.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.worker.min.js';</script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f2f2f7; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        .upload-card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); width: 100%; max-width: 350px; text-align: center; margin-bottom: 20px; }
        
        .invoice-card { 
            background: white; border-radius: 20px; padding: 20px; width: 100%; max-width: 350px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.05); display: none; 
        }
        
        .row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f0f0f0; font-size: 15px; color: #333; }
        .row:last-child { border-bottom: none; }
        .total { font-weight: bold; font-size: 18px; color: #000; margin-top: 10px; border-top: 2px dashed #ddd; padding-top: 15px; }
        
        .apple-pay-btn {
            background-color: black; color: white; border-radius: 10px; width: 100%; height: 48px;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            margin-top: 20px; font-size: 18px; font-weight: 500; -webkit-appearance: none; border: none;
            gap: 8px;
        }
        .apple-pay-btn:active { transform: scale(0.98); opacity: 0.9; }
        
        .apple-logo { width: 45px; height: 100%; background-image: url("https://upload.wikimedia.org/wikipedia/commons/b/b0/Apple_Pay_logo.svg"); background-repeat: no-repeat; background-position: center; background-size: contain; }

        .success-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center; display: none;
        }
        .checkmark { width: 80px; height: 80px; border-radius: 50%; display: block; stroke-width: 2; stroke: #4bb71b; stroke-miterlimit: 10; margin-bottom: 20px; box-shadow: inset 0px 0px 0px #4bb71b; animation: fill .4s ease-in-out .4s forwards, scale .3s ease-in-out .9s both; }
        .checkmark__circle { stroke-dasharray: 166; stroke-dashoffset: 166; stroke-width: 2; stroke-miterlimit: 10; stroke: #4bb71b; fill: none; animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards; }
        .checkmark__check { transform-origin: 50% 50%; stroke-dasharray: 48; stroke-dashoffset: 48; animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.8s forwards; }
        @keyframes stroke { 100% { stroke-dashoffset: 0; } }
        
        .uploadcare--widget__button_type_open { background: #007aff !important; color: white !important; border-radius: 50px !important; padding: 12px 25px !important; font-weight: bold; }
    </style>
</head>
<body>

    <div id="upload-screen" class="upload-card">
        <h2 style="margin-top:0">رفع المستندات</h2>
        <p style="color:#888; font-size:14px; margin-bottom:20px">سيتم حساب التكلفة: 1 ريال لكل 5 صفحات</p>
        <input type="hidden" role="uploadcare-uploader" id="uploader" data-crop="off" />
    </div>

    <div id="invoice-screen" class="invoice-card">
        <h3 style="margin-top:0; text-align:center">ملخص الطلب</h3>
        
        <div class="row"><span>📄 الملف</span><span id="file-name">...</span></div>
        <div class="row"><span>📑 عدد الصفحات</span><span id="page-count">جاري الحساب...</span></div>
        <div class="row"><span>💰 سعر الصفحة</span><span>0.20 ر.س</span></div>
        
        <div class="row total">
            <span>المجموع للدفع</span>
            <span id="total-price">0.00 ر.س</span>
        </div>

        <button class="apple-pay-btn" onclick="processFakePayment()">
            <span style="margin-top: 3px;">Pay with</span> <div class="apple-logo"></div>
        </button>
        
        <p style="text-align:center; font-size:12px; color:#aaa; margin-top:10px">آمن ومشفر عبر Apple Pay</p>
    </div>

    <div id="success-screen" class="success-overlay">
        <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
            <circle class="checkmark__circle" cx="26" cy="26" r="25" fill="none"/>
            <path class="checkmark__check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
        </svg>
        <h2>تم الدفع بنجاح!</h2>
        <p>جاري الطباعة الآن...</p>
    </div>

    <script>
        // 🛑 تم التعديل: السعر 0.20 ريال (يعني 5 صفحات بريال)
        const PRICE_PER_PAGE = 0.20; 

        // 🛑 رابط السكربت الخاص بك
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzfDeJDsZdQz6HL6SViqlvLVXktRW3CNYCcSfrsDDBgcgkaTH0D0sC6Z8KF7IXzxfU3/exec";

        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session_id');
        const kioskId = urlParams.get('kiosk_id');

        const widget = uploadcare.Widget('[role=uploadcare-uploader]');
        let finalFileInfo = null;
        let finalPrice = 0;
        let finalPages = 1;

        widget.onUploadComplete(function(fileInfo) {
            finalFileInfo = fileInfo;
            document.getElementById('upload-screen').style.display = 'none';
            document.getElementById('invoice-screen').style.display = 'block';
            document.getElementById('file-name').innerText = fileInfo.name.substring(0, 20) + "...";

            if (fileInfo.mimeType === 'application/pdf') {
                countPdfPages(fileInfo.cdnUrl);
            } else {
                updateInvoice(1);
            }
        });

        async function countPdfPages(url) {
            try {
                const loadingTask = pdfjsLib.getDocument(url);
                const pdf = await loadingTask.promise;
                updateInvoice(pdf.numPages);
            } catch (error) {
                updateInvoice(1);
            }
        }

        function updateInvoice(pages) {
            finalPages = pages;
            finalPrice = (pages * PRICE_PER_PAGE).toFixed(2);
            document.getElementById('page-count').innerText = pages;
            document.getElementById('total-price').innerText = finalPrice + " ر.س";
        }

        function processFakePayment() {
            const btn = document.querySelector('.apple-pay-btn');
            btn.innerHTML = "Processing...";
            btn.style.opacity = "0.7";
            btn.disabled = true;

            setTimeout(() => {
                document.getElementById('invoice-screen').style.display = 'none';
                document.getElementById('success-screen').style.display = 'flex';
                sendToKiosk();
            }, 2000);
        }

        function sendToKiosk() {
            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST', mode: 'no-cors',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `action=upload_file&session_id=${sessionId}&kiosk_id=${kioskId}&file_uuid=${finalFileInfo.uuid}&file_url=${finalFileInfo.cdnUrl}&price=${finalPrice}&pages=${finalPages}`
            });
        }
    </script>
</body>
</html>

</body>
</html>
