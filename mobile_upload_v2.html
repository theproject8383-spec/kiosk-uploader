<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>خدمة الطباعة الذاتية</title>
    
    <script>
        // 1️⃣ إعدادات Cloudinary
        const CLOUD_NAME = "duyei6hrk"; 
        const UPLOAD_PRESET = "Kioskxxx"; 
    </script>

    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>

    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #ffffff; margin: 0; padding: 20px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            min-height: 100vh; 
        }

        /* 1. تصميم الثعبان */
        #loading-screen { display: flex; flex-direction: column; align-items: center; width: 100%; transition: opacity 0.3s; }
        .snake-container {
            position: relative; width: 140px; height: 140px; 
            display: flex; justify-content: center; align-items: center;
            background: rgba(245, 245, 245, 0.7); border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); overflow: hidden; margin-bottom: 30px;
            cursor: pointer;
        }
        .snake-container span { position: absolute; display: block; }
        .snake-container span:nth-child(1) { top: 0; left: -100%; width: 100%; height: 4px; background: linear-gradient(90deg, transparent, #3498db); animation: anim1 1.5s linear infinite; }
        @keyframes anim1 { 0% { left: -100%; } 50%,100% { left: 100%; } }
        .snake-container span:nth-child(2) { top: -100%; right: 0; width: 4px; height: 100%; background: linear-gradient(180deg, transparent, #3498db); animation: anim2 1.5s linear infinite; animation-delay: 0.375s; }
        @keyframes anim2 { 0% { top: -100%; } 50%,100% { top: 100%; } }
        .snake-container span:nth-child(3) { bottom: 0; right: -100%; width: 100%; height: 4px; background: linear-gradient(270deg, transparent, #3498db); animation: anim3 1.5s linear infinite; animation-delay: 0.75s; }
        @keyframes anim3 { 0% { right: -100%; } 50%,100% { right: 100%; } }
        .snake-container span:nth-child(4) { bottom: -100%; left: 0; width: 4px; height: 100%; background: linear-gradient(360deg, transparent, #3498db); animation: anim4 1.5s linear infinite; animation-delay: 1.125s; }
        @keyframes anim4 { 0% { bottom: -100%; } 50%,100% { bottom: 100%; } }

        .cloud-icon { width: 60px; height: 60px; fill: #3498db; animation: float 2.5s ease-in-out infinite; }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-8px); } 100% { transform: translateY(0px); } }

        h2 { margin: 0; color: #2c3e50; font-size: 20px; font-weight: 600; }
        p { margin: 10px 0 0 0; color: #bdc3c7; font-size: 14px; animation: pulse-text 2s infinite; }
        @keyframes pulse-text { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }

        .retry-btn { margin-top: 30px; padding: 10px 25px; background: white; border: 1px solid #3498db; color: #3498db; border-radius: 50px; cursor: pointer; display: none; font-weight: bold; }

        /* زر التحديث الجديد (يظهر عند التعليق) */
        .force-refresh-btn {
            margin-top: 60px; /* مسافة بعيدة عن التصميم */
            background: none; border: 1px solid #e0e0e0; color: #999;
            padding: 8px 20px; border-radius: 50px; font-size: 13px;
            cursor: pointer; display: none; /* مخفي افتراضياً */
        }
        .force-refresh-btn:hover { background: #f9f9f9; color: #555; border-color: #ccc; }

        /* 2. شاشة الفاتورة */
        #invoice-screen { display: none; width: 100%; max-width: 350px; background: white; border-radius: 20px; padding: 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .preview-box { text-align: center; margin-bottom: 20px; padding: 10px; background: #f8f9fa; border-radius: 15px; border: 1px solid #eee; }
        .preview-img { max-width: 100px; max-height: 140px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: block; margin: 0 auto 10px auto; }
        .file-name { font-size: 13px; color: #555; font-weight: bold; word-break: break-all; }

        .row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f5f5f5; font-size: 15px; color: #333; }
        .total { font-weight: bold; font-size: 20px; color: #000; margin-top: 15px; border-top: 2px dashed #eee; padding-top: 20px; }

        .apple-pay-btn { background-color: black; color: white; border-radius: 12px; width: 100%; height: 50px; display: flex; justify-content: center; align-items: center; cursor: pointer; margin-top: 25px; font-size: 18px; font-weight: 500; border: none; gap: 8px; }
        .apple-logo { width: 45px; height: 100%; background-image: url("https://upload.wikimedia.org/wikipedia/commons/b/b0/Apple_Pay_logo.svg"); background-repeat: no-repeat; background-position: center; background-size: contain; }

        /* 3. شاشة النجاح */
        #success-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 100; flex-direction: column; justify-content: center; align-items: center; }
        .checkmark { width: 80px; height: 80px; border-radius: 50%; display: block; stroke-width: 2; stroke: #4bb71b; stroke-miterlimit: 10; margin-bottom: 20px; box-shadow: inset 0px 0px 0px #4bb71b; animation: fill .4s ease-in-out .4s forwards, scale .3s ease-in-out .9s both; }
        .checkmark__circle { stroke-dasharray: 166; stroke-dashoffset: 166; stroke-width: 2; stroke-miterlimit: 10; stroke: #4bb71b; fill: none; animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards; }
        .checkmark__check { transform-origin: 50% 50%; stroke-dasharray: 48; stroke-dashoffset: 48; animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.8s forwards; }
        @keyframes stroke { 100% { stroke-dashoffset: 0; } }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="snake-container" onclick="openWidget()">
            <span></span><span></span><span></span><span></span>
            <svg class="cloud-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
        </div>
        <h2 id="status-text">جاري الاتصال بالنظام...</h2>
        <p id="sub-status-text">سيتم فتح نافذة الملفات تلقائياً</p>
        
        <button class="retry-btn" onclick="openWidget()">📂 فتح نافذة الرفع</button>
        
        <button id="refresh-page-btn" class="force-refresh-btn" onclick="location.reload()">🔄 تحديث الصفحة</button>
    </div>

    <div id="invoice-screen">
        <h3 style="margin-top:0; text-align:center">تفاصيل الطلب</h3>
        
        <div class="preview-box">
            <img id="file-preview" class="preview-img" src="" alt="معاينة">
            <div id="file-name" class="file-name">...</div>
        </div>

        <div class="row">
            <span>عدد الصفحات (آلي)</span>
            <span id="page-count" style="font-weight:bold; color:#2c3e50">جاري الحساب...</span>
        </div>
        
        <div class="row"><span>سعر الصفحة</span><span>0.20 ر.س</span></div>
        <div class="row total"><span>الإجمالي</span><span id="total-price">0.00 ر.س</span></div>

        <button class="apple-pay-btn" onclick="processPayment()">
            <span style="margin-top:4px">Pay with</span> <div class="apple-logo"></div>
        </button>
    </div>

    <div id="success-screen">
        <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52"><circle class="checkmark__circle" cx="26" cy="26" r="25" fill="none"/><path class="checkmark__check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/></svg>
        <h2>تم الدفع بنجاح!</h2>
        <p>جاري إرسال الطلب...</p>
    </div>

    <script>
        const PRICE_PER_PAGE = 0.20; 
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzfDeJDsZdQz6HL6SViqlvLVXktRW3CNYCcSfrsDDBgcgkaTH0D0sC6Z8KF7IXzxfU3/exec";

        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session_id');
        const kioskId = urlParams.get('kiosk_id');

        let finalFileInfo = null;
        let finalPrice = 0;
        let finalPages = 1;
        let myWidget;

        function openWidget() {
            if (!window.cloudinary) return;

            myWidget = cloudinary.createUploadWidget({
                cloudName: CLOUD_NAME, 
                uploadPreset: UPLOAD_PRESET,
                sources: ['local', 'camera'], 
                multiple: false,  
                resourceType: 'auto', 
                clientAllowedFormats: ["pdf", "png", "jpg", "jpeg", "doc", "docx"], 
                maxFileSize: 50000000, 
                language: "ar", 
                text: { "ar": { "or": "أو", "browse": "تصفح الملفات", "menu": { "files": "ملفاتي" } } },
                styles: { palette: { window: "#FFFFFF", windowBorder: "#90A0B3", tabIcon: "#0078FF", menuIcons: "#5A616A", textDark: "#000000", textLight: "#FFFFFF", link: "#0078FF", action: "#FF620C", inactiveTabIcon: "#0E2F5A", error: "#F44235", inProgress: "#0078FF", complete: "#20B832", sourceBg: "#E4EBF1" } }
            }, (error, result) => { 
                if (!error && result && result.event === "success") { 
                    handleUploadSuccess(result.info);
                }
            });
            myWidget.open();
        }

        function handleUploadSuccess(fileInfo) {
            finalFileInfo = {
                name: fileInfo.original_filename + "." + fileInfo.format,
                uuid: fileInfo.public_id, 
                cdnUrl: fileInfo.secure_url
            };

            document.getElementById('loading-screen').style.display = 'none';
            document.getElementById('invoice-screen').style.display = 'block';

            let name = finalFileInfo.name;
            if(name.length > 25) name = name.substring(0, 22) + "...";
            document.getElementById('file-name').innerText = name;

            let previewUrl = fileInfo.thumbnail_url || fileInfo.secure_url.replace(/\.[^/.]+$/, ".jpg");
            document.getElementById('file-preview').src = previewUrl;

            let pages = 1;
            if (fileInfo.pages && fileInfo.pages > 0) {
                pages = fileInfo.pages;
            } else if (fileInfo.format === 'pdf' && fileInfo.page_count) {
                 pages = fileInfo.page_count;
            }
            updateInvoice(pages);
        }

        function updateInvoice(pages) {
            finalPages = pages;
            finalPrice = (pages * PRICE_PER_PAGE).toFixed(2);
            document.getElementById('page-count').innerText = pages;
            document.getElementById('total-price').innerText = finalPrice + " ر.س";
        }

        function processPayment() {
            const btn = document.querySelector('.apple-pay-btn');
            btn.innerHTML = "Processing...";
            btn.style.opacity = "0.7";
            btn.disabled = true;

            setTimeout(() => {
                document.getElementById('invoice-screen').style.display = 'none';
                document.getElementById('success-screen').style.display = 'flex';
                sendToKiosk();
            }, 2000);
        }

        function sendToKiosk() {
            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST', mode: 'no-cors',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `action=upload_file&session_id=${sessionId}&kiosk_id=${kioskId}&file_uuid=${finalFileInfo.uuid}&file_url=${finalFileInfo.cdnUrl}&price=${finalPrice}&pages=${finalPages}`
            });
        }

        window.addEventListener('load', function() {
            setTimeout(openWidget, 1000);

            // ⏰ مؤقت الأمان: بعد 12 ثانية يظهر زر التحديث
            setTimeout(() => {
                const refreshBtn = document.getElementById('refresh-page-btn');
                if(refreshBtn) refreshBtn.style.display = 'block';
            }, 12000);
        });
    </script>
</body>
</html>
