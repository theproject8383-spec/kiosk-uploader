<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خدمة الطباعة الذاتية</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            text-align: center;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 80%;
            position: relative;
            z-index: 2;
        }
        h1 { color: #2c3e50; margin-bottom: 5px; }
        
        .status-text { 
            color: #7f8c8d; 
            font-size: 18px; 
            margin-bottom: 30px; 
            font-weight: 500;
        }

        /* نقاط الانتظار */
        .dots::after { content: ' .'; animation: dots-move 2s steps(4, end) infinite; }
        @keyframes dots-move { 0%, 20% { content: ''; } 40% { content: '.'; } 60% { content: '..'; } 80%, 100% { content: '...'; } }

        /* 🎨 منطقة الباركود المربعة */
        .qr-wrapper {
            position: relative;
            width: 300px; /* وسعنا المربع شوي عشان الدوران */
            height: 300px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ⬛ الإطار المربع المقطع المتحرك */
        .scan-square {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 4px dashed #3498db; /* لون أزرق */
            box-sizing: border-box;
            border-radius: 15px; /* زوايا ناعمة قليلاً وليست دائرية */
            animation: spin-square 15s linear infinite; /* دوران */
            z-index: 0;
        }

        #qrcode {
            position: relative;
            z-index: 1;
            padding: 15px;
            background: white;
            /* ظل خفيف للباركود نفسه */
            box-shadow: 0 0 10px rgba(0,0,0,0.05); 
        }

        /* حركة دوران المربع */
        @keyframes spin-square {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .session-info { font-size: 14px; color: #bdc3c7; margin-top: 20px; }
        
        /* زر التحديث */
        .refresh-btn { 
            margin-top: 20px; 
            background: #ecf0f1; 
            border: none; 
            padding: 8px 20px; 
            border-radius: 5px; 
            color: #7f8c8d; 
            cursor: pointer; 
            font-weight: bold;
            transition: 0.3s;
        }
        .refresh-btn:hover { background: #bdc3c7; color: white; }

    </style>
</head>
<body>

    <div class="container">
        <h1>امسح الكود لرفع الملف</h1>
        <p class="status-text">بانتظار الملف من الجوال<span class="dots"></span></p>
        
        <div class="qr-wrapper">
            <div class="scan-square"></div>
            <div id="qrcode"></div>
        </div>
        
        <div class="session-info">رقم الجلسة: <span id="session-display"></span></div>
        <button class="refresh-btn" onclick="location.reload()">🔄 تحديث الجلسة</button>
    </div>

    <script>
        // ============================================================
        // 🛑 روابطك (تأكد منها بناءً على صورتك) 🛑
        
        // 1. رابط صفحة الجوال (اللي بيفتحها العميل)
        const MOBILE_PAGE_URL = "https://furyx70.github.io/kiosk_upload/mobile_upload_v2.html"; 
        
        // 2. رابط قوقل سكربت (نفسه ما تغير)
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzYe43-ZczUW0aqhamnZJhhA33R_e6UNJ3NITjYDGR6viDTXA0_N8b2wcUWK5ytx2Zm/exec";
        
        // 3. اسم صفحة الطباعة (اللي بنروح لها بعدين)
        const PRINTING_PAGE_NAME = "status_printing_z88.html";
        // ============================================================

        const sessionId = Math.floor(Math.random() * 1000000);
        const kioskId = "Kiosk1";
        document.getElementById("session-display").innerText = sessionId;

        // دمجنا رابط الجوال مع رقم الجلسة
        const fullUrl = `${MOBILE_PAGE_URL}?session_id=${sessionId}&kiosk_id=${kioskId}`;
        
        // رسم الباركود (مربع ونظيف)
        new QRCode(document.getElementById("qrcode"), { 
            text: fullUrl, 
            width: 220, 
            height: 220,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });

        let pollingTimer = setInterval(checkForFile, 3000);

        function checkForFile() {
            fetch(`${GOOGLE_SCRIPT_URL}?action=check_file&session_id=${sessionId}&kiosk_id=${kioskId}`)
            .then(response => response.json())
            .then(data => {
                if (data.status === "found") {
                    clearInterval(pollingTimer);
                    document.querySelector('.status-text').innerText = "تم الاستلام! جاري التحضير...";
                    document.querySelector('.status-text').style.color = "#27ae60"; // لون أخضر
                    printFile(data.file_uuid);
                }
            })
            .catch(error => console.log("Waiting..."));
        }

        function printFile(fileUuid) {
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = `https://ucarecdn.com/${fileUuid}/-/preview/`;
            document.body.appendChild(iframe);

            iframe.onload = function() {
                iframe.contentWindow.print();
                setTimeout(() => {
                    window.location.href = PRINTING_PAGE_NAME; 
                }, 2000);
            };
        }
    </script>
</body>
</html>
</body>
</html>
