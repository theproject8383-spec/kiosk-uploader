<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خدمة الطباعة الذاتية</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            text-align: center;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 80%;
            position: relative;
            z-index: 2;
        }
        h1 { color: #2c3e50; margin-bottom: 5px; }
        
        /* تنسيق النص المتحرك */
        .status-text { 
            color: #7f8c8d; 
            font-size: 18px; 
            margin-bottom: 30px; 
            font-weight: 500;
        }

        /* 🎨 حركة النقاط (.. ...) */
        .dots::after {
            content: ' .';
            animation: dots-move 2s steps(4, end) infinite;
        }

        @keyframes dots-move {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }

        /* 🎨 منطقة الباركود والدائرة */
        .qr-wrapper {
            position: relative;
            width: 290px;
            height: 290px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .scan-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 4px dashed #3498db;
            border-radius: 50%;
            animation: spin-slow 20s linear infinite;
            box-shadow: 0 0 15px rgba(52, 152, 219, 0.2);
            z-index: 0;
        }

        #qrcode {
            position: relative;
            z-index: 1;
            padding: 15px;
            background: white;
            border-radius: 15px;
        }

        @keyframes spin-slow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .session-info { font-size: 14px; color: #bdc3c7; margin-top: 20px; }
        .refresh-btn { margin-top: 20px; background: none; border: 1px solid #ccc; padding: 5px 15px; border-radius: 15px; color: #ccc; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <h1>امسح الكود لرفع الملف</h1>
        
        <p class="status-text">بانتظار الملف من الجوال<span class="dots"></span></p>
        
        <div class="qr-wrapper">
            <div class="scan-ring"></div>
            <div id="qrcode"></div>
        </div>
        
        <div class="session-info">رقم الجلسة: <span id="session-display"></span></div>
        <button class="refresh-btn" onclick="location.reload()">تحديث الجلسة</button>
    </div>

    <script>
        // ============================================================
        // 🛑 روابطك (تأكد منها) 🛑
        const MOBILE_PAGE_URL = "https://furyx70.github.io/my-printing-kiosk/mobile_upload_v2.html"; 
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzYe43-ZczUW0aqhamnZJhhA33R_e6UNJ3NITjYDGR6viDTXA0_N8b2wcUWK5ytx2Zm/exec";
        const PRINTING_PAGE_NAME = "status_printing_z88.html";
        // ============================================================

        const sessionId = Math.floor(Math.random() * 1000000);
        const kioskId = "Kiosk1";
        document.getElementById("session-display").innerText = sessionId;

        const fullUrl = `${MOBILE_PAGE_URL}?session_id=${sessionId}&kiosk_id=${kioskId}`;
        
        new QRCode(document.getElementById("qrcode"), { 
            text: fullUrl, 
            width: 200, 
            height: 200,
            colorDark : "#2c3e50",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });

        let pollingTimer = setInterval(checkForFile, 3000);

        function checkForFile() {
            fetch(`${GOOGLE_SCRIPT_URL}?action=check_file&session_id=${sessionId}&kiosk_id=${kioskId}`)
            .then(response => response.json())
            .then(data => {
                if (data.status === "found") {
                    clearInterval(pollingTimer);
                    // نغير النص ليعرف العميل أننا استلمنا الملف
                    document.querySelector('.status-text').innerText = "تم الاستلام! جاري التحضير...";
                    printFile(data.file_uuid);
                }
            })
            .catch(error => console.log("Waiting..."));
        }

        function printFile(fileUuid) {
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = `https://ucarecdn.com/${fileUuid}/-/preview/`;
            document.body.appendChild(iframe);

            iframe.onload = function() {
                iframe.contentWindow.print();
                setTimeout(() => {
                    window.location.href = PRINTING_PAGE_NAME; 
                }, 2000);
            };
        }
    </script>
</body>
</html>
