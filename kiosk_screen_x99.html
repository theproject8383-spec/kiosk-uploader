<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الكشك - Secure Print</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; text-align: center; margin: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .container { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 600px; width: 80%; }
        h1 { color: #2c3e50; }
        .status-text { color: #7f8c8d; font-size: 18px; margin-bottom: 30px; }
        #qrcode { margin: 20px auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>نظام الطباعة الآمن</h1>
        <p class="status-text">امسح الكود لرفع الملف...</p>
        <div id="qrcode"></div>
        <p style="font-size:12px; color:#ccc">Session: <span id="session-display"></span></p>
    </div>

    <script>
        // رابط سكربت جوجل الخاص بك
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzfDeJDsZdQz6HL6SViqlvLVXktRW3CNYCcSfrsDDBgcgkaTH0D0sC6Z8KF7IXzxfU3/exec";
        const MOBILE_PAGE_URL = "https://theproject8383-spec.github.io/kiosk-uploader/mobile_upload_v2.html";
        const PRINTING_PAGE_NAME = "status_z88_printing.html";
        const KIOSK_NUMBER = "01";

        // إعداد الجلسة
        const sessionId = Math.floor(Math.random() * 1000000);
        document.getElementById("session-display").innerText = sessionId;

        // توليد الباركود
        const fullUrl = `${MOBILE_PAGE_URL}?session_id=${sessionId}&kiosk_id=${KIOSK_NUMBER}`;
        new QRCode(document.getElementById("qrcode"), { text: fullUrl, width: 200, height: 200 });

        // بدء المراقبة
        let pollingTimer = setInterval(checkForFile, 3000);

        function checkForFile() {
            fetch(`${GOOGLE_SCRIPT_URL}?action=check_file&session_id=${sessionId}`)
            .then(response => response.json())
            .then(data => {
                if (data.status === "found" && data.download_url) {
                    clearInterval(pollingTimer);
                    
                    document.querySelector('.status-text').innerText = "تم الاستلام! جاري التحضير للطباعة...";
                    document.querySelector('.status-text').style.color = "green";

                    console.log("Secure URL received:", data.download_url);
                    
                    // طباعة الرابط المستلم من السيرفر فوراً
                    printUrl(data.download_url);
                }
            })
            .catch(err => console.error("Waiting...", err));
        }

        function printUrl(url) {
            // فتح نافذة الطباعة
            const printWindow = window.open(url, '_blank');
            if (printWindow) {
                setTimeout(() => {
                    printWindow.print();
                    // الانتقال لصفحة الحالة بعد إرسال الأمر
                    window.location.href = PRINTING_PAGE_NAME;
                }, 2000);
            } else {
                alert("يرجى السماح بالنوافذ المنبثقة للطباعة");
            }
        }
    </script>
</body>
</html>
