<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosk Print Service</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            margin: 0; padding: 0;
            background: #111;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            position: relative;
            background: #222;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        h1 { margin: 0 0 20px; color: #03e9f4; font-size: 24px; text-transform: uppercase; letter-spacing: 2px; }

        /* 🐍 تصميم الثعبان الأصلي (النيون) */
        .qr-box {
            position: relative;
            display: inline-block;
            padding: 20px;
            overflow: hidden;
            background: #fff; /* خلفية بيضاء للباركود */
            border-radius: 5px;
        }

        /* الخطوط الأربعة المتحركة */
        .line { position: absolute; display: block; }

        .line:nth-child(1) {
            top: 0; left: -100%; width: 100%; height: 4px;
            background: linear-gradient(90deg, transparent, #03e9f4);
            animation: animate1 2s linear infinite;
        }
        @keyframes animate1 { 0% { left: -100%; } 50%,100% { left: 100%; } }

        .line:nth-child(2) {
            top: -100%; right: 0; width: 4px; height: 100%;
            background: linear-gradient(180deg, transparent, #03e9f4);
            animation: animate2 2s linear infinite; animation-delay: 0.5s;
        }
        @keyframes animate2 { 0% { top: -100%; } 50%,100% { top: 100%; } }

        .line:nth-child(3) {
            bottom: 0; right: -100%; width: 100%; height: 4px;
            background: linear-gradient(270deg, transparent, #03e9f4);
            animation: animate3 2s linear infinite; animation-delay: 1s;
        }
        @keyframes animate3 { 0% { right: -100%; } 50%,100% { right: 100%; } }

        .line:nth-child(4) {
            bottom: -100%; left: 0; width: 4px; height: 100%;
            background: linear-gradient(360deg, transparent, #03e9f4);
            animation: animate4 2s linear infinite; animation-delay: 1.5s;
        }
        @keyframes animate4 { 0% { bottom: -100%; } 50%,100% { bottom: 100%; } }

        /* حالة النجاح (يتحول للأخضر) */
        .qr-box.success .line:nth-child(1) { background: linear-gradient(90deg, transparent, #2ecc71); }
        .qr-box.success .line:nth-child(2) { background: linear-gradient(180deg, transparent, #2ecc71); }
        .qr-box.success .line:nth-child(3) { background: linear-gradient(270deg, transparent, #2ecc71); }
        .qr-box.success .line:nth-child(4) { background: linear-gradient(360deg, transparent, #2ecc71); }
        
        #status { margin-top: 20px; color: #888; font-size: 14px; }
        
        iframe { width: 0; height: 0; border: 0; position: absolute; }
    </style>
</head>
<body>

    <div class="container">
        <h1>امسح للطباعة</h1>
        
        <div class="qr-box" id="snake-container">
            <span class="line"></span>
            <span class="line"></span>
            <span class="line"></span>
            <span class="line"></span>
            <div id="qrcode"></div>
        </div>

        <div id="status">بانتظار الملف...</div>
    </div>

    <iframe id="print-frame"></iframe>

    <script>
        // إعدادات
        const CLOUD_NAME = "duyei6hrk"; 
        const KIOSK_ID = "01";
        const GOOGLE_SCRIPT = "https://script.google.com/macros/s/AKfycbzfDeJDsZdQz6HL6SViqlvLVXktRW3CNYCcSfrsDDBgcgkaTH0D0sC6Z8KF7IXzxfU3/exec";
        const MOBILE_URL = "https://theproject8383-spec.github.io/kiosk-uploader/mobile_upload_v2.html";

        // جلسة جديدة
        const sessionId = Math.floor(Math.random() * 1000000);
        
        // إنشاء الباركود
        const fullLink = `${MOBILE_URL}?session_id=${sessionId}&kiosk_id=${KIOSK_ID}`;
        new QRCode(document.getElementById("qrcode"), { text: fullLink, width: 200, height: 200 });

        // فحص الملفات
        let checkTimer = setInterval(checkFile, 3000);

        function checkFile() {
            fetch(`${GOOGLE_SCRIPT}?action=check_file&session_id=${sessionId}&kiosk_id=${KIOSK_ID}`)
            .then(res => res.json())
            .then(data => {
                if (data.status === "found") {
                    clearInterval(checkTimer);
                    
                    // تغيير التصميم للنجاح
                    document.getElementById("status").innerText = "✅ تم الاستلام! جاري الطباعة...";
                    document.getElementById("status").style.color = "#2ecc71";
                    document.getElementById("snake-container").classList.add("success");

                    // تجهيز الرابط
                    let finalUrl = data.file_url;
                    // إصلاح الرابط إذا كان مجرد معرف
                    if (!finalUrl.startsWith("http")) {
                        finalUrl = `https://res.cloudinary.com/${CLOUD_NAME}/image/upload/${data.file_uuid}.pdf`;
                    } else if (!finalUrl.endsWith(".pdf")) {
                         // تأكد أن الرابط ينتهي بـ pdf عشان المتصفح يفهمه كملف طباعة
                        finalUrl = finalUrl + ".pdf";
                    }

                    console.log("Printing: " + finalUrl);
                    triggerPrint(finalUrl);
                }
            })
            .catch(err => console.log("waiting..."));
        }

        function triggerPrint(url) {
            const iframe = document.getElementById("print-frame");
            // نضع الرابط مباشرة في الـ iframe
            iframe.src = url;

            // خدعة بسيطة: انتظر ثانيتين حتى يحمل الملف ثم اطبعه
            iframe.onload = function() {
                setTimeout(() => {
                    iframe.contentWindow.focus();
                    iframe.contentWindow.print();
                }, 1000);
            };
            
            // احتياط: لو الـ onload ما اشتغل (يصير أحيانا مع PDF)، جرب اطبع بعد 3 ثواني
            setTimeout(() => {
                 iframe.contentWindow.focus();
                 iframe.contentWindow.print();
            }, 3000);
        }
    </script>
</body>
</html>
