<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خدمة الطباعة الذاتية</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; text-align: center; margin: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        
        .container { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 600px; width: 80%; position: relative; z-index: 2; }

        .device-badge { position: absolute; top: 20px; left: 20px; background-color: #eef2f7; color: #2c3e50; padding: 5px 15px; border-radius: 50px; font-weight: bold; font-size: 14px; border: 1px solid #dce4ec; display: flex; align-items: center; gap: 5px; }
        .status-dot { width: 8px; height: 8px; background-color: #27ae60; border-radius: 50%; display: inline-block; }

        h1 { color: #2c3e50; margin-bottom: 5px; margin-top: 10px; }
        .status-text { color: #7f8c8d; font-size: 18px; margin-bottom: 30px; font-weight: 500; }

        /* تصميم الثعبان */
        .qr-wrapper { position: relative; width: 260px; height: 260px; margin: 0 auto 20px auto; display: flex; justify-content: center; align-items: center; background: rgba(255, 255, 255, 0.1); overflow: hidden; border-radius: 4px; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
        .qr-wrapper span { position: absolute; display: block; }
        .qr-wrapper span:nth-child(1) { top: 0; left: -100%; width: 100%; height: 4px; background: linear-gradient(90deg, transparent, #3498db); animation: btn-anim1 2s linear infinite; }
        @keyframes btn-anim1 { 0% { left: -100%; } 50%,100% { left: 100%; } }
        .qr-wrapper span:nth-child(2) { top: -100%; right: 0; width: 4px; height: 100%; background: linear-gradient(180deg, transparent, #3498db); animation: btn-anim2 2s linear infinite; animation-delay: 0.5s; }
        @keyframes anim2 { 0% { top: -100%; } 50%,100% { top: 100%; } }
        .qr-wrapper span:nth-child(3) { bottom: 0; right: -100%; width: 100%; height: 4px; background: linear-gradient(270deg, transparent, #3498db); animation: btn-anim3 2s linear infinite; animation-delay: 1s; }
        @keyframes anim3 { 0% { right: -100%; } 50%,100% { right: 100%; } }
        .qr-wrapper span:nth-child(4) { bottom: -100%; left: 0; width: 4px; height: 100%; background: linear-gradient(360deg, transparent, #3498db); animation: btn-anim4 2s linear infinite; animation-delay: 1.5s; }
        @keyframes anim4 { 0% { bottom: -100%; } 50%,100% { bottom: 100%; } }

        /* الثعبان الأخضر */
        .qr-wrapper.success span:nth-child(1) { background: linear-gradient(90deg, transparent, #27ae60); }
        .qr-wrapper.success span:nth-child(2) { background: linear-gradient(180deg, transparent, #27ae60); }
        .qr-wrapper.success span:nth-child(3) { background: linear-gradient(270deg, transparent, #27ae60); }
        .qr-wrapper.success span:nth-child(4) { background: linear-gradient(360deg, transparent, #27ae60); }
        .qr-wrapper.success span { animation-duration: 0.5s; }

        #qrcode { padding: 15px; background: white; z-index: 1; border: 1px solid #eee; }
        .session-info { font-size: 14px; color: #bdc3c7; margin-top: 20px; }
        .refresh-btn { margin-top: 20px; background: #ecf0f1; border: none; padding: 8px 20px; border-radius: 5px; color: #7f8c8d; cursor: pointer; font-weight: bold; }

        /* 🛑 إطار الطباعة (جعلته ظاهراً للتجربة) */
        /* بعد ما يضبط معك، رجع visibility إلى hidden */
        #print-frame { 
            position: absolute; 
            bottom: 10px; right: 10px; 
            width: 300px; height: 300px; 
            border: 5px solid red; /* حدود حمراء عشان تشوفه */
            background: white;
            z-index: 9999;
            display: none; /* مخفي مبدئياً */
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="device-badge"><span class="status-dot"></span>جهاز رقم <span id="device-id-display">--</span></div>

        <h1>امسح الكود لرفع الملف</h1>
        <p class="status-text">بانتظار الملف من الجوال...</p>
        
        <div class="qr-wrapper" id="snake-box">
            <span></span> <span></span> <span></span> <span></span>
            <div id="qrcode"></div>
        </div>
        
        <div class="session-info">رقم الجلسة: <span id="session-display"></span></div>
        <button class="refresh-btn" onclick="location.reload()">🔄 تحديث الجلسة</button>
    </div>

    <iframe id="print-frame" name="print-frame"></iframe>

    <script>
        const KIOSK_NUMBER = "01"; 
        const MOBILE_PAGE_URL = "https://theproject8383-spec.github.io/kiosk-uploader/mobile_upload_v2.html"; 
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzfDeJDsZdQz6HL6SViqlvLVXktRW3CNYCcSfrsDDBgcgkaTH0D0sC6Z8KF7IXzxfU3/exec";
        const PRINTING_PAGE_NAME = "status_printing_z88.html";

        document.getElementById("device-id-display").innerText = KIOSK_NUMBER;
        const sessionId = Math.floor(Math.random() * 1000000);
        document.getElementById("session-display").innerText = sessionId;

        const fullUrl = `${MOBILE_PAGE_URL}?session_id=${sessionId}&kiosk_id=${KIOSK_NUMBER}`;
        new QRCode(document.getElementById("qrcode"), { text: fullUrl, width: 200, height: 200, colorDark : "#000000", colorLight : "#ffffff", correctLevel : QRCode.CorrectLevel.H });

        let pollingTimer = setInterval(checkForFile, 3000);

        function checkForFile() {
            fetch(`${GOOGLE_SCRIPT_URL}?action=check_file&session_id=${sessionId}&kiosk_id=${KIOSK_NUMBER}`)
            .then(response => response.json())
            .then(data => {
                if (data.status === "found") {
                    clearInterval(pollingTimer);
                    
                    document.querySelector('.status-text').innerText = "تم الاستلام! جاري التحضير...";
                    document.querySelector('.status-text').style.color = "#27ae60"; 
                    document.getElementById('snake-box').classList.add('success');

                    // 🛑 استخدام الرابط الأصلي من السيرفر (أضمن طريقة)
                    let fileUrl = data.file_url;
                    
                    // تحويل الصور إلى PDF عبر رابط كلاوديناري لضمان الطباعة
                    // نبحث عن الامتداد في نهاية الرابط ونستبدله بـ .pdf
                    if (fileUrl) {
                        fileUrl = fileUrl.replace(/\.[^/.]+$/, ".pdf");
                    }

                    console.log("Printing URL:", fileUrl); 
                    startPrinting(fileUrl);
                }
            }).catch(error => console.log("Waiting..."));
        }

        function startPrinting(fileUrl) {
            const iframe = document.getElementById('print-frame');
            
            // 🛑 إظهار الإطار عشان نشوف وش يصير
            iframe.style.display = 'block'; 
            iframe.src = fileUrl;

            iframe.onload = function() {
                setTimeout(() => {
                    iframe.contentWindow.focus();
                    iframe.contentWindow.print();
                    
                    setTimeout(() => { 
                        window.location.href = PRINTING_PAGE_NAME; 
                    }, 6000);
                }, 1500);
            };
        }
    </script>
</body>
</html>
