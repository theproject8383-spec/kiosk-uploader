<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري الطباعة...</title>
    <style>
        /* تم تغيير لون الخلفية هنا إلى الأبيض */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff; /* لون أبيض */
            text-align: center;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: #333;
        }

        .printer-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin-bottom: 30px;
        }

        /* الطابعة */
        .printer {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 160px;
            height: 100px;
            background: #e0e0e0;
            border-radius: 10px 10px 0 0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            z-index: 2;
        }
        .printer::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 15px;
            background: #bdc3c7;
            border-radius: 5px;
        }
        .printer::after {
            content: '';
            position: absolute;
            bottom: 15px;
            right: 20px;
            width: 15px;
            height: 15px;
            background: #27ae60; /* ضوء أخضر */
            border-radius: 50%;
            animation: blink 1s infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        /* الورقة */

            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 0;
            background: #fff;
            border: 1px solid #eee;
            box-shadow: 0 -2px 5px rgba(0,0,0,0.05);
