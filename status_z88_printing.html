<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري الطباعة...</title>
    <style>
        body {
            background-color: #3498db; /* لون أزرق لطيف */
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            height: 100vh; margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: white;
        }

        h1 { margin-bottom: 60px; font-size: 32px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }

        /* 🖨️ رسم الطابعة بالكود فقط */
        .printer-container { position: relative; width: 200px; height: 120px; }
        
        .printer-top {
            position: absolute; bottom: 0; left: 0; width: 200px; height: 80px;
            background: #ecf0f1; border-radius: 20px 20px 5px 5px; z-index: 10;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .printer-top::after { /* الفتحة اللي تطلع منها الورقة */
            content: ''; position: absolute; top: 15px; left: 25px; width: 150px; height: 10px;
            background: #bdc3c7; border-radius: 5px;
        }
        
        .paper {
            position: absolute; left: 35px; width: 130px; height: 0;
            background: white; z-index: 5;
            transition: height 2s ease-out;
            animation: print-paper 2.5s infinite ease-in-out;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        /* حركة الورقة تطلع وتنزل */
        @keyframes print-paper {
            0% { top: 30px; height: 0; }
            40% { top: -60px; height: 100px; } /* الورقة تطلع فوق */
            60% { top: -60px; height: 100px; } 
            100% { top: 80px; height: 140px; opacity: 0; } /* الورقة تنزل تحت وتختفي */
        }

        .status-msg { margin-top: 50px; font-size: 18px; color: #d6eaf8; }
        .back-btn {
            margin-top: 30px; padding: 10px 25px; border: 2px solid white; color: white;
            background: transparent; border-radius: 50px; cursor: pointer; text-decoration: none; font-weight: bold;
            transition: 0.3s;
        }
        .back-btn:hover { background: white; color: #3498db; }

    </style>
</head>
<body>

    <h1>جاري طباعة مستندك...</h1>

    <div class="printer-container">
        <div class="paper"></div>
        <div class="printer-top"></div>
    </div>

    <p class="status-msg">يرجى استلام الورقة من الطابعة بالأسفل 👇</p>
    
    <a href="local_kiosk.html" class="back-btn">طباعة ملف آخر</a>

    <script>
        // إرجاع تلقائي للصفحة الرئيسية بعد 10 ثواني
        setTimeout(() => {
            window.location.href = "local_kiosk.html";
        }, 10000);
    </script>

</body>
</html>
